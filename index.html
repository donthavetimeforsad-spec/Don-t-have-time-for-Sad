<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #111827;
      border-bottom: 1px solid #263044;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      color: #9ca3af;
      margin: 7px 0 0;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 15px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #111827;
      color: white;
      font-size: 15px;
    }

    .price-box {
      background: #111827;
      border: 1px solid #263044;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .symbol {
      color: #9ca3af;
      font-size: 14px;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
      margin-top: 8px;
    }

    .chart {
      height: 300px;
      background:
        linear-gradient(#1f2937 1px, transparent 1px),
        linear-gradient(90deg, #1f2937 1px, transparent 1px);
      background-size: 50px 50px;
      border: 1px solid #263044;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      margin-bottom: 15px;
    }

    .indicators {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      background: #111827;
      border: 1px solid #263044;
      border-radius: 10px;
      padding: 15px;
    }

    .card-title {
      color: #9ca3af;
      font-size: 13px;
    }

    .card-value {
      font-size: 20px;
      font-weight: bold;
      margin-top: 7px;
    }

    .signal {
      margin-top: 15px;
      padding: 20px;
      text-align: center;
      border-radius: 12px;
      background: #132a20;
      border: 1px solid #245c42;
    }

    .signal h2 {
      margin: 0;
      color: #22c55e;
    }

    .levels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .level {
      background: #111827;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .entry {
      color: #38bdf8;
    }

    .tp {
      color: #22c55e;
    }

    .sl {
      color: #ef4444;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .indicators {
        grid-template-columns: 1fr 1fr;
      }

      .levels {
        grid-template-columns: 1fr;
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📊 Trade Analyzer</h1>
  <p>Market analysis dashboard</p>
</header>

<div class="container">

  <div class="controls">

    <select id="symbol">
      <option>XAUUSDm — Exness MT5</option>
      <option>BTCUSDT</option>
      <option>ETHUSDT</option>
      <option>XAUTUSDT</option>
      <option>SOLUSDT</option>
    </select>

    <select id="timeframe">
      <option>1 Minute</option>
      <option>5 Minutes</option>
      <option>15 Minutes</option>
      <option>1 Hour</option>
      <option>4 Hours</option>
      <option>1 Day</option>
    </select>

  </div>

  <div class="price-box">
    <div class="symbol" id="selectedSymbol">
      XAUUSDm — Exness MT5
    </div>

    <div class="price">
      <span id="price">Loading...</span>
    </div>
  </div>

  <div class="chart">
    📈 Live Trading Chart
    <br>
    <small>Chart connection will be added next</small>
  </div>
