<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Analyzer</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080c14;
 color:#fff;
 font-family:Arial,sans-serif
}
header{
 padding:20px;
 text-align:center;
 background:#111827;
 border-bottom:1px solid #263044
}
h1{margin:0;font-size:26px}
.container{max-width:900px;margin:auto;padding:15px}
select{
 width:100%;
 padding:14px;
 margin-bottom:12px;
 background:#111827;
 color:white;
 border:1px solid #374151;
 border-radius:9px;
 font-size:16px
}
.box{
 background:#111827;
 border:1px solid #263044;
 border-radius:12px;
 padding:18px;
 margin-bottom:15px
}
.name{color:#9ca3af}
.price{
 font-size:34px;
 font-weight:bold;
 margin-top:8px
}
.status{
 color:#22c55e;
 margin-top:8px
}
.chart{
 height:280px;
 border-radius:12px;
 border:1px solid #263044;
 background:
 linear-gradient(#1f2937 1px,transparent 1px),
 linear-gradient(90deg,#1f2937 1px,transparent 1px);
 background-size:40px 40px;
 display:flex;
 justify-content:center;
 align-items:center;
 color:#6b7280;
 margin-bottom:15px
}
.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px
}
.card{
 background:#111827;
 border:1px solid #263044;
 border-radius:10px;
 padding:15px
}
.label{color:#9ca3af;font-size:13px}
.value{font-size:19px;margin-top:7px;font-weight:bold}
.signal{
 margin-top:15px;
 padding:18px;
 text-align:center;
 background:#10251b;
 border:1px solid #1f6b46;
 border-radius:12px
}
.signal h2{color:#22c55e;margin:0}
@media(max-width:600px){
 .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>
<h1>📊 Trade Analyzer</h1>
<p>Live Market Analysis</p>
</header>

<div class="container">

<select id="symbol">
<option value="BTCUSDT">BTCUSDT</option>
<option value="ETHUSDT">ETHUSDT</option>
<option value="XAUTUSDT">XAUTUSDT</option>
<option value="XAUUSDm">XAUUSDm — Exness MT5</option>
</select>

<div class="box">
<div class="name" id="name">BTCUSDT</div>
<div class="price" id="price">Connecting...</div>
<div class="status" id="status">● Connecting to market...</div>
</div>

<div class="chart">
📈 LIVE CHART
</div>

<div class="grid">

<div class="card">
<div class="label">RSI</div>
<div class="value">56.4</div>
</div>

<div class="card">
<div class="label">MACD</div>
<div class="value">Bullish</div>
</div>

<div class="card">
<div class="label">EMA 20</div>
<div class="value">Above</div>
</div>

<div class="card">
<div class="label">EMA 50</div>
<div class="value">Above</div>
</div>

<div class="card">
<div class="label">Support</div>
<div class="value">Strong</div>
</div>

<div class="card">
<div class="label">Resistance</div>
<div class="value">Nearby</div>
</div>

</div>

<div class="signal">
<h2>🟢 LONG</h2>
<p>Technical analysis signal</p>
</div>

</div>

<script>

const symbolSelect = document.getElementById("symbol");
const priceElement = document.getElementById("price");
const statusElement = document.getElementById("status");
const nameElement = document.getElementById("name");

async function getPrice(){

    const symbol = symbolSelect.value;

    nameElement.textContent = symbol;

    if(symbol === "XAUUSDm"){
        priceElement.textContent = "MT5 DATA";
        statusElement.textContent =
        "● Exness MT5 connection required";
        statusElement.style.color = "#f59e0b";
        return;
    }

    try{

        statusElement.textContent = "● Updating...";

        const response = await fetch(
          "https://api.binance.com/api/v3/ticker/price?symbol=" + symbol
        );

        const data = await response.json();

        if(data.price){

            priceElement.textContent =
            Number(data.price).toLocaleString(
              undefined,
              {maximumFractionDigits:8}
            );

            statusElement.textContent =
            "● LIVE MARKET DATA";

            statusElement.style.color = "#22c55e";

        }else{
            throw new Error("No price");
        }

    }catch(error){

        priceElement.textContent = "Unavailable";

        statusElement.textContent =
        "● Market data unavailable";

        statusElement.style.color = "#ef4444";
    }
}

symbolSelect.addEventListener("change",getPrice);

getPrice();

setInterval(getPrice,5000);

</script>

</body>
</html>
